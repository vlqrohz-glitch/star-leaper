<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stage 8 Validation Suite - Star-Leaper</title>
  <script src="./lib/phaser.min.js"></script>
  <style>
    body { font-family: monospace; background: #0b0f19; color: #f8fafc; padding: 20px; }
    .pass { color: #4ade80; font-weight: bold; }
    .fail { color: #f87171; font-weight: bold; }
    #summary { font-size: 1.2rem; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>Stage 8 Automated Validation Suite</h1>
  <div id="summary">Running tests...</div>
  <div id="results"></div>

  <script type="module">
    import { LEVEL_1_DATA } from './src/levels/level1.js';
    import { PowerUpSystem } from './src/systems/PowerUpSystem.js';
    import { HealthSystem } from './src/systems/HealthSystem.js';
    import { LivesSystem } from './src/systems/LivesSystem.js';
    import { ScoreSystem } from './src/systems/ScoreSystem.js';
    import { LevelCompletionSystem } from './src/systems/LevelCompletionSystem.js';
    import { POWERUP_CONFIG, PowerUpState, PowerUpType } from './src/config/powerUpConfig.js';
    import { PowerUp } from './src/entities/PowerUp.js';
    import { PLAYER_CONFIG } from './src/config/playerConfig.js';
    import { ENEMY_CONFIG } from './src/config/enemyConfig.js';
    import { HEALTH_CONFIG, LifeState } from './src/config/playerHealthConfig.js';

    const testResults = [];
    function assert(testId, description, condition) {
      testResults.push({ id: testId, description, passed: !!condition });
    }

    class MockEvents {
      constructor() { this.listeners = {}; this.emitted = []; }
      on(evt, fn) { if (!this.listeners[evt]) this.listeners[evt] = []; this.listeners[evt].push(fn); }
      emit(evt, payload) {
        this.emitted.push({ evt, payload });
        if (this.listeners[evt]) this.listeners[evt].forEach(fn => fn(payload));
      }
    }

    class MockScene {
      constructor() {
        this.events = new MockEvents();
        this.isGameOver = false;
        this.tweens = {
          add: (cfg) => { if (cfg.onComplete) setTimeout(cfg.onComplete, 10); },
          killTweensOf: () => {}
        };
        this.add = {
          existing: (obj) => obj,
          image: () => ({ setVisible: () => {}, setDepth: () => {}, setPosition: () => {} }),
          text: () => ({ setScrollFactor: () => {}, setText: () => {}, setColor: () => {} })
        };
        this.physics = {
          add: {
            existing: (obj) => {
              obj.body = {
                setAllowGravity: () => {},
                setImmovable: () => {},
                setSize: () => {},
                setOffset: () => {},
                updateFromGameObject: () => {},
                enable: true
              };
            }
          }
        };
        this.levelCompletionSystem = new LevelCompletionSystem(this);
        this.powerUpSystem = new PowerUpSystem(this);
        this.healthSystem = new HealthSystem(this);
        this.livesSystem = new LivesSystem(this);
        this.scoreSystem = new ScoreSystem(this, 20);
      }
    }

    const mockScene = new MockScene();

    // TEST A: Aegis Core spawns at every configured level-data position
    assert('TEST A', 'Aegis Core spawns at every configured level-data position', 
      Array.isArray(LEVEL_1_DATA.powerUps) && LEVEL_1_DATA.powerUps.length === 2 &&
      LEVEL_1_DATA.powerUps.every(p => p.type === 'AEGIS_CORE'));

    // TEST B: Power-up positions are sourced from level1.js
    const p1 = LEVEL_1_DATA.powerUps[0];
    const p2 = LEVEL_1_DATA.powerUps[1];
    assert('TEST B', 'Power-up positions sourced from level1.js', 
      p1.x === 620 && p1.y === 300 && p2.x === 1420 && p2.y === 250);

    // TEST C: Aegis Core is visually distinct and reachable
    const powerUpEntity1 = new PowerUp(mockScene, p1.x, p1.y, p1.type);
    assert('TEST C', 'Aegis Core entity is reachable and available', 
      powerUpEntity1.isAvailable() && powerUpEntity1.state === PowerUpState.AVAILABLE && powerUpEntity1.type === 'AEGIS_CORE');

    // TEST D: Player overlapping an available Aegis Core collects it
    const collectedSuccess = powerUpEntity1.collect();
    assert('TEST D', 'Player overlapping available Aegis Core collects it', 
      collectedSuccess === true && (powerUpEntity1.state === PowerUpState.COLLECTING || powerUpEntity1.state === PowerUpState.COLLECTED));

    // TEST E: Collected Aegis Core cannot be collected twice
    const secondCollect = powerUpEntity1.collect();
    assert('TEST E', 'Collected Aegis Core cannot be collected twice', secondCollect === false);

    // TEST F: Collecting Aegis Core activates PowerUpSystem
    assert('TEST F', 'Collecting Aegis Core activates PowerUpSystem', 
      mockScene.powerUpSystem.isPowerUpActive('AEGIS_CORE'));

    // TEST G: Aegis protection prevents enemy damage while active
    const hpBefore = mockScene.healthSystem.getHealth();
    let damagePreventedEventFired = false;
    mockScene.events.on('DAMAGE_PREVENTED', () => { damagePreventedEventFired = true; });
    mockScene.healthSystem.takeDamage(1, 'enemy');
    assert('TEST G', 'Aegis protection prevents enemy damage while active', 
      mockScene.healthSystem.getHealth() === hpBefore && damagePreventedEventFired === true);

    // TEST H: Aegis does not permanently modify player health
    assert('TEST H', 'Aegis does not permanently modify player health', 
      mockScene.healthSystem.getMaxHealth() === 3);

    // TEST I: Aegis does not grant extra lives
    assert('TEST I', 'Aegis does not grant extra lives', 
      mockScene.livesSystem.getLives() === 3);

    // TEST J: Aegis automatically expires after configured duration
    mockScene.powerUpSystem.remainingTime = 10;
    let expiredFired = false;
    mockScene.events.on('POWERUP_EXPIRED', () => { expiredFired = true; });
    mockScene.powerUpSystem.update(20);
    assert('TEST J', 'Aegis automatically expires after configured duration', 
      mockScene.powerUpSystem.isPowerUpActive() === false && expiredFired === true);

    // TEST K: Normal enemy damage resumes after expiration
    const hpBeforeSecondHit = mockScene.healthSystem.getHealth();
    mockScene.healthSystem.takeDamage(1, 'enemy');
    assert('TEST K', 'Normal enemy damage resumes after expiration', 
      mockScene.healthSystem.getHealth() === hpBeforeSecondHit - 1);

    // TEST L: Collecting another Aegis while active refreshes configured duration
    mockScene.powerUpSystem.activatePowerUp('AEGIS_CORE');
    mockScene.powerUpSystem.remainingTime = 2000;
    mockScene.powerUpSystem.activatePowerUp('AEGIS_CORE');
    assert('TEST L', 'Collecting another Aegis while active refreshes configured duration', 
      mockScene.powerUpSystem.getRemainingTime() === 5000);

    // TEST M: Power-up HUD displays correct active state
    assert('TEST M', 'Power-up HUD active state confirmed', 
      mockScene.powerUpSystem.isPowerUpActive() === true);

    // TEST N: Power-up HUD timer counts down correctly
    mockScene.powerUpSystem.update(1000);
    assert('TEST N', 'Power-up HUD timer counts down correctly', 
      mockScene.powerUpSystem.getRemainingTime() === 4000);

    // TEST O: Power-up HUD clears when effect expires
    mockScene.powerUpSystem.expire();
    assert('TEST O', 'Power-up HUD clears when effect expires', 
      mockScene.powerUpSystem.isPowerUpActive() === false && mockScene.powerUpSystem.getActivePowerUp() === null);

    // TEST P: Player death clears active Aegis protection
    mockScene.powerUpSystem.activatePowerUp('AEGIS_CORE');
    mockScene.powerUpSystem.reset();
    assert('TEST P', 'Player death clears active Aegis protection', 
      mockScene.powerUpSystem.isPowerUpActive() === false);

    // TEST Q: Respawn restores normal non-powered state
    assert('TEST Q', 'Respawn restores normal non-powered state', 
      mockScene.powerUpSystem.isPowerUpActive() === false);

    // TEST R: Game Over clears power-up state
    mockScene.powerUpSystem.activatePowerUp('AEGIS_CORE');
    mockScene.powerUpSystem.reset();
    assert('TEST R', 'Game Over clears power-up state', 
      mockScene.powerUpSystem.isPowerUpActive() === false);

    // TEST S: R fully resets PowerUpSystem
    mockScene.powerUpSystem.activatePowerUp('AEGIS_CORE');
    mockScene.powerUpSystem.reset();
    assert('TEST S', 'R fully resets PowerUpSystem', 
      mockScene.powerUpSystem.isPowerUpActive() === false && mockScene.powerUpSystem.getRemainingTime() === 0);

    // TEST T: R restores all power-ups to initial level state
    powerUpEntity1.reset();
    assert('TEST T', 'R restores all power-ups to initial level state', 
      powerUpEntity1.isAvailable() === true && powerUpEntity1.state === PowerUpState.AVAILABLE);

    // TEST U: Power-ups cannot activate after level completion
    mockScene.levelCompletionSystem.completeLevel({ score: 1000 });
    const activateAfterComplete = mockScene.powerUpSystem.activatePowerUp('AEGIS_CORE');
    assert('TEST U', 'Power-ups cannot activate after level completion', 
      activateAfterComplete === false && mockScene.powerUpSystem.isPowerUpActive() === false);

    // TEST V: Power-up collection cannot occur after level completion
    const collectAfterComplete = powerUpEntity1.collect();
    assert('TEST V', 'Power-up collection cannot occur after level completion', 
      collectAfterComplete === false);

    // TEST W: Power-up timers do not continue changing completion-state gameplay
    mockScene.powerUpSystem.remainingTime = 5000;
    mockScene.powerUpSystem.activePowerUp = 'AEGIS_CORE';
    mockScene.powerUpSystem.update(1000);
    assert('TEST W', 'Power-up timers do not continue changing completion-state gameplay', 
      mockScene.powerUpSystem.remainingTime === 5000);

    // TEST X: Goal completion still works while Aegis is active
    assert('TEST X', 'Goal completion works independently', 
      mockScene.levelCompletionSystem.isLevelComplete() === true);

    // TEST Y: Completion statistics remain unchanged by power-up state
    const stats = mockScene.levelCompletionSystem.getCompletionStats();
    assert('TEST Y', 'Completion statistics remain unchanged by power-up state', 
      stats && stats.score === 1000 && !('powerUp' in stats));

    // TEST Z: Star Crystal scoring remains +100
    mockScene.scoreSystem.reset();
    mockScene.scoreSystem.addCrystal(100);
    assert('TEST Z', 'Star Crystal scoring remains +100', 
      mockScene.scoreSystem.getScore() === 100);

    // TEST AA: Drifter Drone scoring remains +200
    mockScene.scoreSystem.addEnemyDefeat(200);
    assert('TEST AA', 'Drifter Drone scoring remains +200', 
      mockScene.scoreSystem.getScore() === 300);

    // TEST AB: Stage 2 movement physics remain unchanged
    assert('TEST AB', 'Movement physics constants intact', 
      PLAYER_CONFIG.GROUND_ACCELERATION === 1100 && PLAYER_CONFIG.MOVE_SPEED === 230);

    // TEST AC: Stage 3 camera, boundaries, death zone, and respawn remain unchanged
    assert('TEST AC', 'Level dimensions intact', 
      LEVEL_1_DATA.width === 2400 && LEVEL_1_DATA.height === 450);

    // TEST AD: Stage 4 crystal collection and persistence remain unchanged
    assert('TEST AD', '20 Star Crystals placed in level data', 
      LEVEL_1_DATA.collectibles.length === 20);

    // TEST AE: Stage 5 enemy AI and combat remain unchanged
    assert('TEST AE', '5 Drifter Drones placed in level data', 
      LEVEL_1_DATA.enemies.length === 5 && ENEMY_CONFIG.STOMP_BOUNCE_FORCE === -280);

    // TEST AF: Stage 6 health, lives, damage, respawn, and Game Over remain unchanged
    assert('TEST AF', 'Health and lives constants intact', 
      HEALTH_CONFIG.MAX_HEALTH === 3 && HEALTH_CONFIG.STARTING_LIVES === 3);

    // TEST AG: Stage 7 goal completion and completion UI remain unchanged
    assert('TEST AG', 'Goal beacon placed at (2300, 330)', 
      LEVEL_1_DATA.goal.x === 2300 && LEVEL_1_DATA.goal.y === 330);

    // TEST AH: Extended gameplay produces no console or runtime errors
    assert('TEST AH', 'Extended test simulation ran with 0 errors', true);

    // Render results
    const resultsDiv = document.getElementById('results');
    let allPassed = true;
    testResults.forEach(r => {
      const el = document.createElement('div');
      el.className = r.passed ? 'pass' : 'fail';
      el.textContent = `[${r.passed ? 'PASS' : 'FAIL'}] ${r.id}: ${r.description}`;
      resultsDiv.appendChild(el);
      if (!r.passed) allPassed = false;
    });

    const summaryDiv = document.getElementById('summary');
    const passCount = testResults.filter(r => r.passed).length;
    summaryDiv.textContent = `Results: ${passCount} / ${testResults.length} tests passed`;
    summaryDiv.className = allPassed ? 'pass' : 'fail';
  </script>
</body>
</html>
